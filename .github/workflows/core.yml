name: Core and Android verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  socket-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact socket snapshots in a fresh private network namespace
        run: sudo -n unshare --net python3 scripts/verify-socket-diag.py
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify protocols and owned files
        run: |
          python3 scripts/verify-android-files-api.py
          python3 scripts/verify-static-reverse-fetch.py
          python3 scripts/verify-frida-probe-build.py
          python3 scripts/verify-frida-resources.py
          python3 scripts/verify-frida-sources.py
          python3 scripts/verify-frida-node-fetch.py
          python3 scripts/verify-release-package.py
          python3 scripts/verify-frida-spawn-record.py
          python3 scripts/verify-apk-jvm-inputs.py
          python3 scripts/verify-python-bundle.py
          python3 scripts/verify-frida-input.py
          python3 scripts/verify-frida-fd-channel.py
          sudo -n python3 scripts/verify-frida-managed-control.py
          ./gradlew :core:test --console=plain
      - name: Verify signed Ubuntu image and actual POSIX rootfs extraction
        run: bash scripts/verify-linux-image.sh
      - name: Verify native PTY process lifecycle on Linux host
        run: |
          python3 scripts/verify-terminal-sources.py
          python3 scripts/verify-native-pty.py
      - name: Verify ptrace tracer-death kernel prerequisite on Linux host
        run: python3 scripts/verify-ptrace-exitkill.py
      - name: Verify Root namespace teardown on Linux host
        run: sudo -n python3 scripts/verify-linux-namespaces.py
      - name: Verify task cgroup events and supervisor death on Linux host
        run: |
          sudo -n python3 scripts/verify-linux-scopes.py
          sudo -n python3 scripts/verify-linux-scope-recovery.py
          sudo -n python3 scripts/verify-linux-chroot-mounts.py
          sudo -n python3 scripts/verify-linux-pty.py
          sudo -n python3 scripts/verify-linux-metadata-gc.py
      - name: Install matching stable Android SDK
        run: bash scripts/setup-android-sdk.sh
      - name: Build pinned Frida ARM64 qualification worker without packaging
        run: python3 scripts/build-frida-probe.py --directory app/build/outputs/frida-qualification --ndk "$ANDROID_HOME/ndk/30.0.16248370" --download
      - name: Build and audit Android ARM64 managed guard without packaging
        run: python3 scripts/build-managed-guard.py --directory app/build/outputs/managed-qualification --ndk "$ANDROID_HOME/ndk/30.0.16248370"
      - name: Restore exact native source archive
        id: native-source-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/aurora-native-downloads/talloc-2.5.0.tar.gz
          key: talloc-source-912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007
      - name: Prefetch verified native source with bounded transport retries
        run: bash scripts/prefetch-native-source.sh
      - name: Cache verified native source before compilation
        if: steps.native-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/aurora-native-downloads/talloc-2.5.0.tar.gz
          key: talloc-source-912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007
      - name: Prepare verified source and generated PRoot adapter
        run: |
          if ! command -v flex || ! command -v bison; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends flex bison
          fi
          flex --version
          bison --version
          ./gradlew ':app:configureCMakeDebug[x86_64]' --console=plain
      - name: Verify actual derived PRoot lifecycle on Linux host
        run: python3 scripts/verify-proot-lifecycle.py
      - name: Verify pinned packet tools and offline filtering on Linux host
        run: python3 scripts/verify-packet-tools.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build exact Java bridge for APK assets
        run: |
          npm ci --prefix tools/frida-bridge --ignore-scripts --no-audit --no-fund
          python3 scripts/prepare-frida-node.py
          npm run build --prefix tools/frida-bridge
      - name: Build Android application and run lint
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug :frida-fixture:assembleDebug --console=plain
      - name: Verify packaged Linux ELF dependencies and corresponding source
        run: |
          python3 scripts/verify-linux-native.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify-linux-native.py app/build/outputs/apk/release/app-release-unsigned.apk
          python3 scripts/package-linux-sources.py
          python3 scripts/verify-managed-source-roundtrip.py app/build/outputs/linux-sources/aurora-linux-corresponding-source.zip --reference app/build/outputs/managed-qualification/report.json --ndk "$ANDROID_HOME/ndk/30.0.16248370" --report app/build/outputs/managed-qualification/source-rebuild.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurora-development-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            frida-fixture/build/outputs/apk/debug/*.apk
            app/build/outputs/linux-sources/*.zip
            app/build/outputs/frida-qualification/report.json
            app/build/outputs/frida-qualification/readelf.txt
            app/build/outputs/frida-qualification/linked-members.json
            app/build/outputs/frida-qualification/worker.map
            app/build/outputs/frida-qualification/resources.json
            app/build/frida-worker/report.json
            app/build/outputs/managed-qualification/report.json
            app/build/outputs/managed-qualification/readelf.txt
            app/build/outputs/managed-qualification/source-rebuild.json
          if-no-files-found: error
          retention-days: 14

  managed-supervision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact report streams and native supervisor events
        run: |
          python3 scripts/verify-frida-managed-receive.py
          python3 scripts/verify-frida-managed-observe.py
          sudo -n python3 scripts/verify-managed-journal.py
          sudo -n python3 scripts/verify-managed-launch.py
          sudo -n python3 scripts/verify-managed-scope-plan.py
          sudo -n python3 scripts/verify-managed-guard.py

  frida-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build exact official Java bridge without npm install hooks
        run: |
          npm ci --prefix tools/frida-bridge --ignore-scripts --no-audit --no-fund
          python3 scripts/prepare-frida-node.py
          npm run build --prefix tools/frida-bridge
      - name: Prepare native crash diagnostics
        run: |
          if ! command -v gdb; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gdb
          fi
      - name: Verify actual Frida session lifecycle on owned Linux targets
        run: sudo -n env AURORA_FRIDA_JAVA_BUNDLE="$PWD/tools/frida-bridge/build/java-bridge.js" python3 scripts/verify-frida-session.py
